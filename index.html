<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MindPulse AI | Student Wellness Predictor</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <main class="app-shell">
      <section class="page-title-card">
        <p class="section-label">Student wellness AI</p>
        <h1>MindPulse AI</h1>
        <p class="title-description">Predict mental health insights with confidence.</p>
      </section>

      <section class="content-card">
        <form id="predict-form" class="predict-form">
          <div class="form-heading">
            <div>
              <p class="section-label">Prediction form</p>
              <h2>MindPulse AI Insights</h2>
            </div>
            <p class="section-note">Use realistic values for the best result.</p>
          </div>

          <div class="form-grid">
            <label>
              Age
              <input id="age" type="number" min="10" max="100" placeholder="e.g. 20" required />
            </label>

            <label>
              Gender
              <select id="gender" required>
                <option value="">Select gender</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
              </select>
            </label>

            <label>
              Country
              <select id="country" required>
                <option value="">Select country</option>
                <option value="India">India</option>
                <option value="USA">USA</option>
                <option value="Canada">Canada</option>
                <option value="Australia">Australia</option>
                <option value="UK">UK</option>
                <option value="Germany">Germany</option>
                <option value="Mexico">Mexico</option>
                <option value="Turkey">Turkey</option>
                <option value="France">France</option>
                <option value="Other">Other</option>
              </select>
            </label>

            <label>
              Academic level
              <select id="academic_level" required>
                <option value="">Select academic level</option>
                <option value="Undergraduate">Undergraduate</option>
                <option value="Graduate">Graduate</option>
                <option value="High School">High School</option>
              </select>
            </label>

            <label>
              Most used platform
              <select id="most_used_platform" required>
                <option value="">Select platform</option>
                <option value="Instagram">Instagram</option>
                <option value="Facebook">Facebook</option>
                <option value="LinkedIn">LinkedIn</option>
                <option value="Snapchat">Snapchat</option>
                <option value="Twitter">Twitter</option>
                <option value="YouTube">YouTube</option>
                <option value="TikTok">TikTok</option>
                <option value="WhatsApp">WhatsApp</option>
                <option value="WeChat">WeChat</option>
              </select>
            </label>

            <label>
              Purpose of use
              <select id="purpose_of_use" required>
                <option value="">Select purpose</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Education">Education</option>
                <option value="Networking">Networking</option>
                <option value="News">News</option>
              </select>
            </label>

            <label>
              Avg daily usage hours
              <input id="avg_daily_usage_hours" type="number" step="0.1" min="0" max="24" placeholder="e.g. 4.5" required />
            </label>

            <label>
              Daily unlocks
              <input id="daily_unlocks" type="number" min="0" placeholder="e.g. 30" required />
            </label>

            <label>
              Study hours
              <input id="study_hours" type="number" step="0.1" min="0" max="24" placeholder="e.g. 3.5" required />
            </label>

            <label>
              Physical activity hours
              <input id="physical_activity_hours" type="number" step="0.1" min="0" max="2" placeholder="e.g. 1" required />
            </label>

            <label>
              Sleep hours per night
              <input id="sleep_hours_per_night" type="number" step="0.1" min="0" max="24" placeholder="e.g. 7" required />
            </label>

            <label>
              Stress level
              <select id="stress_level" required>
                <option value="">Select stress level</option>
                <option value="High">High</option>
                <option value="Medium">Medium</option>
                <option value="Low">Low</option>
                <option value="Very High">Very High</option>
              </select>
            </label>
          </div>

          <button type="submit" class="submit-btn">Predict now</button>
        </form>

        <section id="result-card" class="result-card hidden">
          <div class="result-visual">
            <div class="donut-chart" aria-label="Prediction score chart">
              <svg viewBox="0 0 140 140">
                <circle class="donut-track" cx="70" cy="70" r="52"></circle>
                <circle id="donut-progress" class="donut-progress" cx="70" cy="70" r="52"></circle>
              </svg>
              <div class="donut-center">
                <strong id="donut-score">0.00</strong>
                <span>/10</span>
              </div>
            </div>

            <div class="result-meta">
              <p class="section-label">Prediction result</p>
              <h3 id="score-value">--</h3>
              <p id="score-message">Your result will appear here.</p>
            </div>
          </div>

          <p id="api-status" class="api-status">Ready</p>
        </section>

        <section id="error-card" class="error-card hidden"></section>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
